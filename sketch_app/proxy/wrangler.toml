name = "sketch-ai-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Per-device daily quota is stored here. Create it once:
#   wrangler kv namespace create USAGE
# and paste the id below.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Burst protection: at most 10 requests per device per minute.
[[unsafe.bindings]]
name = "BURST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
# Requests per device per UTC day for free users. Pro devices are unlimited.
FREE_DAILY_LIMIT = "5"
# Models the app may ask for.
ALLOWED_MODELS = "claude-opus-5,claude-sonnet-5"
# Upper bound on max_tokens per request.
MAX_TOKENS_CAP = "8192"

# Secrets (never in this file):
#   wrangler secret put ANTHROPIC_API_KEY   the Claude key
#   wrangler secret put APP_TOKEN           shared token the app sends as x-sketch-token
