name: Sketch app

on:
  push:
    paths: ["sketch_app/**", ".github/workflows/sketch_app.yml"]
  pull_request:
    paths: ["sketch_app/**", ".github/workflows/sketch_app.yml"]

jobs:
  flutter:
    name: Analyze, test, build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sketch_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK (unsigned)
        # The proxy URL and app token are optional repository secrets; when
        # they are unset the APK falls back to the key entered in Settings.
        run: >-
          flutter build apk --release
          --dart-define=SKETCH_AI_PROXY_URL=${{ secrets.SKETCH_AI_PROXY_URL }}
          --dart-define=SKETCH_AI_APP_TOKEN=${{ secrets.SKETCH_AI_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: sketch-release-apk
          path: sketch_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sketch_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  proxy:
    name: Proxy typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sketch_app/proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sketch_app/proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
